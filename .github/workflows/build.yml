name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  WAILS_VERSION: v2.10.1

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Build
        run: wails build -clean -s -platform windows/amd64 -nsis

      - name: Package
        shell: pwsh
        run: |
          $name = "BSManager-${{ github.event.release.tag_name }}-windows-amd64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item build/bin/BSManager-amd64-installer.exe, LICENSE, README.md "dist/$name"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
